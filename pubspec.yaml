name: ownproject
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter


  go_router: ^14.6.0
  cupertino_icons: ^1.0.8
  ripple_wave: ^0.1.5
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  easy_localization: ^3.0.8


  google_mlkit_text_recognition: ^0.15.1
  photo_view: ^0.15.0
  flutter_portal: ^1.1.4
  http: ^1.2.2
  image_picker: ^1.2.1
  image: ^4.7.2
  camera: ^0.11.0+2
  sensors_plus: ^6.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_svg: ^2.2.3





dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # -----------------------------
  # FONTS (Poppins)
  # -----------------------------
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
  assets:
    - assets/icons/
    - assets/lang/